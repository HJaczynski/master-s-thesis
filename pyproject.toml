[project]
name = "cv-model-benchmark"
version = "0.1.0"
description = "Computer Vision Model Benchmarking Tool - Test and optimize CV models with various optimization methods"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Hubert Jaczynski"}
]
keywords = ["computer-vision", "benchmarking", "optimization", "deep-learning", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pandas>=1.5.0",
    "seaborn>=0.12.0",
    "matplotlib>=3.5.0",
    "numpy>=1.21.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "pycocotools>=2.0.7",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
detectors = [
    "rfdetr>=1.6.0",
    "ultralytics>=8.0.0",
    "onnx>=1.16.0",
]
export = [
    "onnxruntime-gpu>=1.18.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "jupyter>=1.0.0",
]

[project.scripts]
cv-benchmark = "cv_model_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
