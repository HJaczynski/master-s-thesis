hardware:
  local_gpu: NVIDIA GeForce RTX 3070 Ti
  local_gpu_memory_gb: 8
  primary_batch_size: 1
  secondary_batch_size: 8
  notes:
    - Use batch size 1 for the main latency claims.
    - Treat batch size 8 as throughput-only and skip it for variants that exceed memory.

dataset:
  name: COCO 2017
  root: data/coco
  val_images: data/coco/val2017
  val_annotations: data/coco/annotations/instances_val2017.json
  calibration_images: 500
  smoke_test_images: 64

models:
  - id: rfdetr_nano
    family: rfdetr
    role: fast_transformer
    framework: rfdetr
    class_name: RFDETRNano
    checkpoint: auto
    input_size: 384
    published_coco_ap_50_95: 48.4
    published_coco_ap_50: 67.6
    published_params_m: 30.5
    license: Apache-2.0
    priority: fallback
    notes: Smaller RF-DETR variant for quick local iteration.

  - id: rfdetr_medium
    family: rfdetr
    role: main_transformer
    framework: rfdetr
    class_name: RFDETRMedium
    checkpoint: src/rf-detr-medium.pth
    input_size: 576
    published_coco_ap_50_95: 54.7
    published_coco_ap_50: 73.6
    published_params_m: 33.7
    license: Apache-2.0
    priority: primary
    notes: Preferred RF-DETR baseline because the checkpoint is already present.

  - id: swin_t_mask_rcnn
    family: swin
    role: hierarchical_vit
    framework: mmdetection
    config: configs/swin/mask_rcnn_swin-t-p4-w7_fpn_3x_coco.py
    checkpoint: checkpoints/mask_rcnn_swin_tiny_patch4_window7.pth
    input_size: "short-edge 800, max 1333"
    published_coco_ap_50_95: 46.0
    published_mask_ap: 41.6
    published_params_m: 48
    published_flops_g: 267
    license: Apache-2.0
    priority: primary
    notes: Use the official Swin object detection repo or a compatible MMDetection config.

  - id: yolo_v8s
    family: yolo
    role: fast_cnn_baseline
    framework: ultralytics
    weights: yolov8s.pt
    input_size: 640
    published_coco_ap_50_95: 44.9
    published_params_m: 11.2
    published_flops_g: 28.6
    license: AGPL-3.0
    priority: fallback
    notes: Fast baseline for smoke tests and pruning experiments.

  - id: yolo_v8m
    family: yolo
    role: main_cnn_baseline
    framework: ultralytics
    weights: yolov8m.pt
    input_size: 640
    published_coco_ap_50_95: 50.2
    published_params_m: 25.9
    published_flops_g: 78.9
    license: AGPL-3.0
    priority: primary
    notes: Main YOLO baseline; use YOLOv8s if memory or iteration speed becomes a problem.

  - id: yolo26n
    family: yolo
    generation: yolo26
    role: newest_fast_yolo_baseline
    framework: ultralytics
    weights: yolo26n.pt
    input_size: 640
    published_coco_ap_50_95: 40.9
    published_coco_ap_50_95_e2e: 40.1
    published_cpu_onnx_ms: "38.9 +/- 0.7"
    published_t4_tensorrt10_ms: "1.7 +/- 0.0"
    published_params_m: 2.4
    published_flops_g: 5.4
    license: AGPL-3.0
    priority: fallback
    notes: Smallest YOLO26 detector; useful for smoke tests and edge-first comparisons.

  - id: yolo26s
    family: yolo
    generation: yolo26
    role: newest_small_yolo_baseline
    framework: ultralytics
    weights: yolo26s.pt
    input_size: 640
    published_coco_ap_50_95: 48.6
    published_coco_ap_50_95_e2e: 47.8
    published_cpu_onnx_ms: "87.2 +/- 0.9"
    published_t4_tensorrt10_ms: "2.5 +/- 0.0"
    published_params_m: 9.5
    published_flops_g: 20.7
    license: AGPL-3.0
    priority: recommended
    notes: Strong default YOLO26 size for RTX 3070 Ti iteration.

  - id: yolo26m
    family: yolo
    generation: yolo26
    role: newest_main_yolo_baseline
    framework: ultralytics
    weights: yolo26m.pt
    input_size: 640
    published_coco_ap_50_95: 53.1
    published_coco_ap_50_95_e2e: 52.5
    published_cpu_onnx_ms: "220.0 +/- 1.4"
    published_t4_tensorrt10_ms: "4.7 +/- 0.1"
    published_params_m: 20.4
    published_flops_g: 68.2
    license: AGPL-3.0
    priority: primary
    notes: Main newer YOLO baseline for comparison against YOLOv8m and RF-DETR Medium.
